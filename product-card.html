<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f4f5">
  <title>Кофемолка ручная «Жезл»</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="product-card" aria-labelledby="product-title">
      <figure class="product-media">
        <img class="product-photo" src="images/product.jpg" alt="Старинная ручная кофемолка на светлом фоне">
        <figcaption class="photo-credit">
          Фото <a href="https://commons.wikimedia.org/wiki/File:Coffee_Grinder_Zassenhaus.jpg">© Benjamin Hell</a> ·
          <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>
        </figcaption>
      </figure>
      <div class="product-info">
        <p class="product-tag">Хит продаж</p>
        <h1 class="product-title" id="product-title">Кофемолка ручная «Жезл»</h1>
        <p class="product-description">Керамические жернова и 15 степеней помола. Подходит для эспрессо и турки.</p>
        <p class="product-price">24 990 ₸ <span class="product-old-price">29 990 ₸</span></p>
        <button class="product-button" type="button">В корзину</button>
      </div>
    </article>
  </main>
</body>
</html>
