<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофемолка ручная «Жезл» — Tailwind</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-w-[320px] bg-zinc-100 text-zinc-900 antialiased">
  <main class="mx-auto max-w-5xl px-4 py-8 md:px-8 md:py-12">
    <article class="overflow-hidden rounded-2xl bg-white shadow-lg md:flex">
      <figure class="relative h-64 md:h-[440px] md:w-1/2">
        <img class="block h-full w-full object-cover" src="images/product.jpg" alt="Старинная ручная кофемолка на светлом фоне">
        <figcaption class="absolute bottom-3 left-3 rounded-lg bg-white/95 px-2 py-1 text-xs text-zinc-700">
          Фото <a class="underline" href="https://commons.wikimedia.org/wiki/File:Coffee_Grinder_Zassenhaus.jpg">© Benjamin Hell</a> ·
          <a class="underline" href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a>
        </figcaption>
      </figure>
      <div class="p-6 md:flex md:w-1/2 md:flex-col md:justify-center md:p-10">
        <p class="mb-3 inline-block w-fit rounded-full bg-purple-100 px-3 py-1 text-sm font-bold text-purple-700">Хит продаж</p>
        <h1 class="mb-3 text-2xl font-bold leading-tight">Кофемолка ручная «Жезл»</h1>
        <p class="mb-5 leading-relaxed text-zinc-600">Керамические жернова и 15 степеней помола. Подходит для эспрессо и турки.</p>
        <p class="mb-5 text-3xl font-bold">24 990 ₸ <span class="ml-2 text-base font-normal text-zinc-400 line-through">29 990 ₸</span></p>
        <button class="w-full cursor-pointer rounded-lg bg-purple-600 px-5 py-3.5 font-bold text-white transition hover:bg-purple-700 md:w-auto" type="button">В корзину</button>
      </div>
    </article>
  </main>
</body>
</html>
